site_name: MonarchVision for FIRST® Robotics Competition
site_description: Documentation for FRC vision processing, simulation, replay, and hardware-in-the-loop testing

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Demonstrations: demos.md
  - Vision Hardware: 
      - Overview: vision-hardware/index.md
      - Limelight: vision-hardware/limelight.md
      - Rubik Pi3 / PhotonVision: vision-hardware/rubik.md
  - Simulation Framework: 
      - Overview: simulation-framework/index.md
      - AdvantageScope: simulation-framework/advantagescope.md
      - AdvantageKit: simulation-framework/advantagekit.md
      - Log Files: simulation-framework/advantagekit-log-files.md
  - Simulating with Vision Hardware:
      - Overview: hardware-in-loop/index.md
      - Field vision: hardware-in-loop/field-vision.md
      - Object detection: hardware-in-loop/object-detection.md
  - Simulating without Vision Hardware:
      - Overview: pure-simulation/index.md
      - Field vision: pure-simulation/field-vision.md
      - Object detection: pure-simulation/object-detection.md
      - Drive to object: pure-simulation/drive-to-object.md
  - Video Index: video-links.md

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css